name: ci

on:
  push:
  pull_request:

jobs:
  cpp:
    name: C++ build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libeigen3-dev ninja-build
      - name: Configure
        run: cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cmake
      - name: Test
        run: ctest --test-dir build/cmake --output-on-failure

  notebooks:
    name: Python module and solution notebooks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libeigen3-dev
      - name: Install the module
        run: python -m pip install ".[notebooks]"
      - name: Exercise notebooks match their sources and carry no outputs
        run: |
          python tools/build_notebooks.py --check
          python tools/strip_notebooks.py --check
      - name: Execute every solution notebook
        run: python tools/execute_notebooks.py --no-save
